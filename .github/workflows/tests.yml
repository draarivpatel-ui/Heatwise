name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/heat.test.mjs                 # unit tests: WBGT physics, flags, window, forecast fallbacks, 429 + offline cache
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils    # pdfinfo/pdftotext for the print checks
      - run: python tests/browser/offline_429_qa.py   # rate limit (HTTP 429) and offline: saved forecast, honest labels, EN/ES
      - run: python tests/browser/print_plan_qa.py    # replay coach sheet + full plan print checks
      - run: python tests/browser/coach_print_qa.py   # coach sheet: 1 Letter page per language
      - run: python tests/browser/place_picker_qa.py  # 390 px picker: long names wrap, same-looking places told apart, EN/ES
      - run: python tests/browser/axe_states_qa.py    # axe-core: 9 states x 390/1280 x EN/ES, plus a language switch mid-flow
      - run: python tests/browser/lang_flash_qa.py    # Spanish visitors never see the English page flash; 3 s fail-safe
      - run: python tests/browser/edge_inputs_qa.py   # extreme numbers, same start/finish hour, 1-letter search, language switch mid-flow
